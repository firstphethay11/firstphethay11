<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Sunset Gradient (Tyler Flower Boy Inspired) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180d24"/>
      <stop offset="30%" stop-color="#4a1525"/>
      <stop offset="60%" stop-color="#9a2c18"/>
      <stop offset="82%" stop-color="#e05307"/>
      <stop offset="96%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="45%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Shadow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 32px; fill: #ffffff; letter-spacing: 1.2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 14.5px; fill: #ffedd5; letter-spacing: 0.5px; }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 12.5px; fill: #fde68a; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #fed7aa; letter-spacing: 0.8px; }
  </style>

  <!-- Clip boundary for rounded card -->
  <clipPath id="cardClip">
    <rect width="900" height="240" rx="16" ry="16"/>
  </clipPath>

  <g clip-path="url(#cardClip)">
    <!-- Sky Background -->
    <rect width="900" height="240" fill="url(#skyGrad)"/>

    <!-- Subtle Dither / Grid overlay for retro aesthetic -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
    </g>

    <!-- Warm Golden Sun -->
    <circle cx="750" cy="100" r="65" fill="url(#sunGlow)"/>
    <circle cx="750" cy="100" r="32" fill="#fffbeb" opacity="0.95"/>

    <!-- Distant Clouds (Stylized Warm Puffs) -->
    <path d="M 620,70 Q 640,55 665,65 Q 690,60 705,75 Q 715,90 695,95 L 610,95 Q 600,85 620,70 Z" fill="#fde047" opacity="0.25"/>
    <path d="M 120,50 Q 140,38 165,46 Q 185,42 195,55 L 110,55 Q 105,48 120,50 Z" fill="#fed7aa" opacity="0.2"/>

    <!-- Rolling Hills Layer 3 (Far Distance) -->
    <path d="M 0,165 Q 180,140 400,168 T 900,158 L 900,240 L 0,240 Z" fill="#2d4a22" opacity="0.85"/>

    <!-- Rolling Hills Layer 2 (Mid-ground) -->
    <path d="M 0,188 Q 260,165 560,192 T 900,182 L 900,240 L 0,240 Z" fill="#1b3815" opacity="0.95"/>

    <!-- Rolling Hills Layer 1 (Foreground Deep Forest) -->
    <path d="M 0,210 Q 320,192 640,215 T 900,202 L 900,240 L 0,240 Z" fill="#0d200a"/>

    <!-- Flower / Sunflower Silhouettes on right hill edge -->
    <g transform="translate(820, 165)" opacity="0.6">
      <circle cx="0" cy="0" r="8" fill="#facc15"/>
      <circle cx="0" cy="0" r="3" fill="#713f12"/>
      <path d="M 0,8 Q 2,22 8,35" stroke="#14532d" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(845, 172)" opacity="0.6">
      <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="2.5" fill="#713f12"/>
      <path d="M 0,6 Q -3,18 2,28" stroke="#14532d" stroke-width="1.8" fill="none"/>
    </g>

    <!-- Content Group -->
    <g transform="translate(52, 34)">
      <!-- Mini Pill Badge -->
      <g>
        <rect x="0" y="0" width="285" height="26" rx="13" fill="#000000" fill-opacity="0.38" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1"/>
        <circle cx="14" cy="13" r="4" fill="#22c55e"/>
        <circle cx="14" cy="13" r="7" fill="#22c55e" opacity="0.25"/>
        <text x="26" y="17" class="badge-txt">FIRSTPHETHAY11 // RMUTI CPE</text>
      </g>

      <!-- Main Title -->
      <text x="0" y="66" class="title" filter="url(#textGlow)">Jirawat Thiamthanong</text>

      <!-- Subtitle -->
      <text x="1" y="94" class="subtitle" filter="url(#subtleShadow)">Computer Engineering • Full-Stack Web &amp; Embedded Systems</text>

      <!-- Terminal Quote Tagline -->
      <g transform="translate(0, 114)">
        <rect x="0" y="0" width="460" height="28" rx="6" fill="#000000" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        <text x="14" y="19" class="mono">&gt; "No fluff. Just systems that actually work."</text>
      </g>
    </g>

    <!-- Outer Border -->
    <rect width="900" height="240" rx="16" ry="16" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>
</svg>