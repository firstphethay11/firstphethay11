<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="100%" height="176">
  <defs>
    <!-- Terminal Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13171f"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>

    <!-- Signal Bus Gradient -->
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Clip Path -->
    <clipPath id="termClip">
      <rect width="900" height="176" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <style>
    .code-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
    }
    .sans-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Blinking Terminal Cursor */
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-cursor {
      animation: cursorBlink 1.05s infinite;
    }

    /* Status LED breathing pulse */
    @keyframes statusPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    .led-pulse {
      transform-origin: 808px 17px;
      animation: statusPulse 2.4s ease-in-out infinite;
    }

    /* Bus signal trace scanning horizontally */
    @keyframes traceSignal {
      0% { transform: translateX(-120px); opacity: 0; }
      15% { opacity: 0.85; }
      75% { opacity: 0.85; }
      100% { transform: translateX(920px); opacity: 0; }
    }
    .bus-trace {
      animation: traceSignal 6.8s linear infinite;
    }
  </style>

  <g clip-path="url(#termClip)">
    <!-- Base Background -->
    <rect width="900" height="176" fill="url(#termBg)"/>

    <!-- Subtle PCB / Terminal Grid Pattern -->
    <g opacity="0.04" stroke="#ffffff" stroke-width="0.6">
      <line x1="0" y1="35" x2="900" y2="35"/>
      <line x1="0" y1="70" x2="900" y2="70"/>
      <line x1="0" y1="105" x2="900" y2="105"/>
      <line x1="0" y1="140" x2="900" y2="140"/>
      <line x1="180" y1="35" x2="180" y2="176"/>
      <line x1="360" y1="35" x2="360" y2="176"/>
      <line x1="540" y1="35" x2="540" y2="176"/>
      <line x1="720" y1="35" x2="720" y2="176"/>
    </g>

    <!-- Top Window Titlebar -->
    <rect width="900" height="35" fill="#181d27"/>
    <line x1="0" y1="35" x2="900" y2="35" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Animated Data Signal gliding across titlebar divider -->
    <line class="bus-trace" x1="0" y1="35" x2="80" y2="35" stroke="url(#busGrad)" stroke-width="1.8"/>

    <!-- Window Controls (Mac / Unix Dots) -->
    <circle cx="22" cy="17" r="5" fill="#ef4444" opacity="0.9"/>
    <circle cx="38" cy="17" r="5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="54" cy="17" r="5" fill="#10b981" opacity="0.9"/>

    <!-- Title / Path -->
    <text x="76" y="21" class="code-font" font-size="12" fill="#94a3b8" letter-spacing="0.3px">cpe@rmuti:~# sys_info.sh</text>

    <!-- Right-side Status Telemetry -->
    <circle cx="808" cy="17" r="4" fill="#22c55e" class="led-pulse"/>
    <text x="819" y="21" class="code-font" font-size="11" font-weight="600" fill="#86efac" letter-spacing="0.5px">SYS_ONLINE</text>

    <!-- Vertical Divider between Bio and System Metrics -->
    <line x1="530" y1="35" x2="530" y2="176" stroke="#334155" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>

    <!-- ==================== LEFT COLUMN: BIO & FOCUS ==================== -->
    <!-- Prompt line 1 -->
    <text x="24" y="60" class="code-font" font-size="13" font-weight="600" fill="#f59e0b">$ whoami --academic</text>

    <!-- Identity line -->
    <text x="24" y="82" class="sans-font" font-size="14.5" font-weight="700" fill="#ffffff">Jirawat Thiamthanong (First)</text>
    <text x="252" y="82" class="sans-font" font-size="13" fill="#94a3b8">• Computer Engineering @ RMUTI</text>

    <!-- Mission / Focus line -->
    <text x="24" y="107" class="sans-font" font-size="13" fill="#cbd5e1">Bridging the gap between </text>
    <text x="178" y="107" class="sans-font" font-size="13" font-weight="700" fill="#fde047">Hardware &amp; Software</text>
    <text x="323" y="107" class="sans-font" font-size="13" fill="#cbd5e1">: from low-level</text>

    <text x="24" y="127" class="sans-font" font-size="13" fill="#cbd5e1">microcontroller firmware to modern, production-ready web platforms.</text>

    <!-- Interactive Status Command line with Blinking Cursor -->
    <text x="24" y="154" class="code-font" font-size="12.5" fill="#38bdf8">cpe@core:~$</text>
    <text x="116" y="154" class="code-font" font-size="12.5" fill="#f1f5f9">run --target=embedded-fullstack</text>
    <rect x="380" y="141" width="7.5" height="15" fill="#f59e0b" class="term-cursor"/>

    <!-- ==================== RIGHT COLUMN: ARCHITECTURE & TELEMETRY ==================== -->
    <text x="555" y="58" class="code-font" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="0.6px">[ SYSTEM ARCHITECTURE ]</text>

    <!-- Metric 1: Track -->
    <text x="555" y="80" class="code-font" font-size="11" fill="#64748b">CORE :</text>
    <text x="605" y="80" class="code-font" font-size="11.5" font-weight="600" fill="#ffffff">Full-Stack Web &amp; Embedded IoT</text>

    <!-- Metric 2: Hardware -->
    <text x="555" y="102" class="code-font" font-size="11" fill="#64748b">HW   :</text>
    <text x="605" y="102" class="code-font" font-size="11.5" fill="#fed7aa">ESP32 • MicroPython • C/Arduino</text>

    <!-- Metric 3: Software -->
    <text x="555" y="124" class="code-font" font-size="11" fill="#64748b">SW   :</text>
    <text x="605" y="124" class="code-font" font-size="11.5" fill="#fde047">React 19 • Tailwind • Node • SQL</text>

    <!-- Metric 4: Status -->
    <text x="555" y="146" class="code-font" font-size="11" fill="#64748b">ENV  :</text>
    <text x="605" y="146" class="code-font" font-size="11.5" fill="#86efac">Linux • Docker • Cloud • Git</text>

    <!-- Outer Border -->
    <rect width="900" height="176" rx="10" ry="10" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.2"/>
  </g>
</svg>
