<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Sunset Gradient (Tyler Flower Boy Inspired) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180d24"/>
      <stop offset="30%" stop-color="#4a1525"/>
      <stop offset="60%" stop-color="#9a2c18"/>
      <stop offset="82%" stop-color="#e05307"/>
      <stop offset="96%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="45%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Wind Streamline Gradient (Fade on edges) -->
    <linearGradient id="windStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffedd5" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#fde047" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Shadows -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #ffffff; letter-spacing: 1.2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 16.5px; fill: #ffedd5; letter-spacing: 0.5px; }

    /* --- Animations --- */
    
    /* Sun breathing glow */
    @keyframes sunBreath {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .sun-pulse {
      transform-origin: 750px 100px;
      animation: sunBreath 6s ease-in-out infinite;
    }

    /* Distant clouds slow drift */
    @keyframes cloudFloat1 {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(28px); }
    }
    @keyframes cloudFloat2 {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-22px); }
    }
    .cloud-1 { animation: cloudFloat1 18s ease-in-out infinite; }
    .cloud-2 { animation: cloudFloat2 22s ease-in-out infinite; }

    /* Flowers swaying in the wind */
    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(4.5deg); }
      55% { transform: rotate(-2deg); }
      80% { transform: rotate(5deg); }
    }
    .flower-sway {
      transform-origin: 835px 205px;
      animation: sway 5.5s ease-in-out infinite;
    }

    /* Wind Breeze Gusts */
    @keyframes windGust1 {
      0% { transform: translateX(-350px); opacity: 0; }
      12% { opacity: 0.75; }
      80% { opacity: 0.75; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    @keyframes windGust2 {
      0% { transform: translateX(-350px); opacity: 0; }
      15% { opacity: 0.6; }
      75% { opacity: 0.6; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    @keyframes windGust3 {
      0% { transform: translateX(-350px); opacity: 0; }
      10% { opacity: 0.8; }
      82% { opacity: 0.8; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    .wind-1 { animation: windGust1 7s cubic-bezier(0.25, 0.1, 0.25, 1) 0s infinite; }
    .wind-2 { animation: windGust2 8.5s cubic-bezier(0.25, 0.1, 0.25, 1) 2.5s infinite; }
    .wind-3 { animation: windGust3 6.8s cubic-bezier(0.25, 0.1, 0.25, 1) 4.2s infinite; }

    /* Drifting Golden Petals / Pollen across the breeze */
    @keyframes petalFlight1 {
      0% { transform: translate(-40px, 70px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.85; }
      50% { transform: translate(460px, 95px) rotate(220deg); opacity: 0.9; }
      90% { opacity: 0.75; }
      100% { transform: translate(960px, 75px) rotate(440deg); opacity: 0; }
    }
    @keyframes petalFlight2 {
      0% { transform: translate(-40px, 120px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.9; }
      45% { transform: translate(430px, 145px) rotate(-180deg); opacity: 0.85; }
      88% { opacity: 0.7; }
      100% { transform: translate(960px, 115px) rotate(-360deg); opacity: 0; }
    }
    @keyframes petalFlight3 {
      0% { transform: translate(-40px, 155px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.8; }
      55% { transform: translate(500px, 175px) rotate(260deg); opacity: 0.85; }
      92% { opacity: 0.65; }
      100% { transform: translate(960px, 150px) rotate(520deg); opacity: 0; }
    }
    @keyframes petalFlight4 {
      0% { transform: translate(-40px, 100px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.75; }
      50% { transform: translate(480px, 85px) rotate(190deg); opacity: 0.8; }
      90% { opacity: 0.6; }
      100% { transform: translate(960px, 105px) rotate(380deg); opacity: 0; }
    }
    .petal-1 { animation: petalFlight1 7.2s cubic-bezier(0.3, 0.1, 0.25, 1) 0.5s infinite; }
    .petal-2 { animation: petalFlight2 8.4s cubic-bezier(0.3, 0.1, 0.25, 1) 3s infinite; }
    .petal-3 { animation: petalFlight3 6.9s cubic-bezier(0.3, 0.1, 0.25, 1) 1.8s infinite; }
    .petal-4 { animation: petalFlight4 9.1s cubic-bezier(0.3, 0.1, 0.25, 1) 4.6s infinite; }
  </style>

  <!-- Clip boundary for rounded card -->
  <clipPath id="cardClip">
    <rect width="900" height="240" rx="16" ry="16"/>
  </clipPath>

  <g clip-path="url(#cardClip)">
    <!-- Sky Background -->
    <rect width="900" height="240" fill="url(#skyGrad)"/>

    <!-- Subtle Dither / Grid overlay for retro aesthetic -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
    </g>

    <!-- Warm Golden Sun with Breathing Glow Animation -->
    <g class="sun-pulse">
      <circle cx="750" cy="100" r="65" fill="url(#sunGlow)"/>
      <circle cx="750" cy="100" r="32" fill="#fffbeb" opacity="0.95"/>
    </g>

    <!-- Distant Clouds (Drifting Gently) -->
    <g class="cloud-1">
      <path d="M 620,70 Q 640,55 665,65 Q 690,60 705,75 Q 715,90 695,95 L 610,95 Q 600,85 620,70 Z" fill="#fde047" opacity="0.25"/>
    </g>
    <g class="cloud-2">
      <path d="M 120,50 Q 140,38 165,46 Q 185,42 195,55 L 110,55 Q 105,48 120,50 Z" fill="#fed7aa" opacity="0.2"/>
    </g>

    <!-- ==================== ANIMATED WIND STREAMS ==================== -->
    <!-- Wind Stream 1 (High sky breeze) -->
    <path class="wind-1" d="M 0,72 Q 120,58 240,75 T 480,68 T 720,78" fill="none" stroke="url(#windStream)" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Wind Stream 2 (Mid-level graceful wind gust with a loop) -->
    <g class="wind-2">
      <path d="M 0,118 Q 140,132 260,112 Q 320,102 335,110 Q 345,120 330,126 Q 315,130 335,125 T 560,115 T 780,122" fill="none" stroke="url(#windStream)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Wind Stream 3 (Low skimming gust over the rolling hill) -->
    <path class="wind-3" d="M 0,162 Q 160,148 320,165 T 640,156 T 820,164" fill="none" stroke="url(#windStream)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- ==================== ANIMATED DRIFTING PETALS ==================== -->
    <!-- Petal 1 (Warm gold oval) -->
    <g class="petal-1">
      <ellipse cx="0" cy="0" rx="5" ry="2.8" fill="#fde047" opacity="0.85"/>
    </g>
    <!-- Petal 2 (Amber petal) -->
    <g class="petal-2">
      <ellipse cx="0" cy="0" rx="4.5" ry="2.2" fill="#fbbf24" opacity="0.8"/>
    </g>
    <!-- Petal 3 (Sunburst speck) -->
    <g class="petal-3">
      <circle cx="0" cy="0" r="2.8" fill="#fef08a" opacity="0.9"/>
    </g>
    <!-- Petal 4 (Soft peach petal) -->
    <g class="petal-4">
      <ellipse cx="0" cy="0" rx="4" ry="2" fill="#fed7aa" opacity="0.75"/>
    </g>

    <!-- Rolling Hills Layer 3 (Far Distance) -->
    <path d="M 0,165 Q 180,140 400,168 T 900,158 L 900,240 L 0,240 Z" fill="#2d4a22" opacity="0.85"/>

    <!-- Rolling Hills Layer 2 (Mid-ground) -->
    <path d="M 0,188 Q 260,165 560,192 T 900,182 L 900,240 L 0,240 Z" fill="#1b3815" opacity="0.95"/>

    <!-- Rolling Hills Layer 1 (Foreground Deep Forest) -->
    <path d="M 0,210 Q 320,192 640,215 T 900,202 L 900,240 L 0,240 Z" fill="#0d200a"/>

    <!-- Sunflowers on right hill swaying in the wind -->
    <g class="flower-sway">
      <g transform="translate(820, 165)">
        <circle cx="0" cy="0" r="8" fill="#facc15"/>
        <circle cx="0" cy="0" r="3" fill="#713f12"/>
        <path d="M 0,8 Q 2,22 8,35" stroke="#14532d" stroke-width="2" fill="none"/>
      </g>
      <g transform="translate(845, 172)">
        <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
        <circle cx="0" cy="0" r="2.5" fill="#713f12"/>
        <path d="M 0,6 Q -3,18 2,28" stroke="#14532d" stroke-width="1.8" fill="none"/>
      </g>
    </g>

    <!-- Clean Typography Group (Centered Vertically) -->
    <g transform="translate(60, 105)">
      <!-- Main Title -->
      <text x="0" y="0" class="title" filter="url(#textGlow)">Jirawat Thiamthanong</text>

      <!-- Subtitle -->
      <text x="2" y="32" class="subtitle" filter="url(#subtleShadow)">Computer Engineering • Full-Stack Web &amp; Embedded Systems</text>
    </g>

    <!-- Outer Border -->
    <rect width="900" height="240" rx="16" ry="16" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>
</svg>