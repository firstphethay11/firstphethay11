<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80">
  <defs>
    <!-- Sunset Gradient 1: Deep Dusk Wine & Terracotta (Back Layer) -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#782015" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#9a3412" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Sunset Gradient 2: Rich Burnt Sunset Amber (Middle Layer) -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#ea580c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Sunset Gradient 3: Vibrant Flower Boy Golden Orange (Front Layer) -->
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Golden Crest Rim Gradient -->
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>

    <clipPath id="waveClip">
      <rect width="900" height="80"/>
    </clipPath>
  </defs>

  <style>
    /* Continuous seamless horizontal flowing animations */
    @keyframes flowLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-900px); }
    }
    @keyframes flowRight {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(0); }
    }
    @keyframes sparkleFloat {
      0%, 100% { opacity: 0.2; transform: translateY(0) scale(0.8); }
      50% { opacity: 0.95; transform: translateY(-6px) scale(1.25); }
    }

    .wave-layer-1 {
      animation: flowLeft 14s linear infinite;
    }
    .wave-layer-2 {
      animation: flowRight 18s linear infinite;
    }
    .wave-layer-3 {
      animation: flowLeft 10s linear infinite;
    }

    .sparkle-1 { animation: sparkleFloat 3.2s ease-in-out 0.2s infinite; transform-origin: 180px 22px; }
    .sparkle-2 { animation: sparkleFloat 4.1s ease-in-out 1.5s infinite; transform-origin: 410px 30px; }
    .sparkle-3 { animation: sparkleFloat 3.6s ease-in-out 0.8s infinite; transform-origin: 620px 20px; }
    .sparkle-4 { animation: sparkleFloat 4.5s ease-in-out 2.3s infinite; transform-origin: 780px 26px; }
  </style>

  <g clip-path="url(#waveClip)">
    <!-- LAYER 1: BACK WAVE (Flowing Left) -->
    <path class="wave-layer-1" d="M 0,32 C 80,32 140,16 220,16 C 300,16 370,36 450,36 C 530,36 600,20 680,20 C 760,20 820,32 900,32 C 980,32 1040,16 1120,16 C 1200,16 1270,36 1350,36 C 1430,36 1500,20 1580,20 C 1660,20 1720,32 1800,32 L 1800,80 L 0,80 Z" fill="url(#waveGrad1)"/>

    <!-- LAYER 2: MIDDLE WAVE (Flowing Right) -->
    <path class="wave-layer-2" d="M 0,24 C 90,24 170,38 260,38 C 350,38 400,18 490,18 C 580,18 630,36 720,36 C 810,36 840,24 900,24 C 990,24 1070,38 1160,38 C 1250,38 1300,18 1390,18 C 1480,18 1530,36 1620,36 C 1710,36 1740,24 1800,24 L 1800,80 L 0,80 Z" fill="url(#waveGrad2)"/>

    <!-- LAYER 3: FRONT WAVE (Flowing Left) -->
    <g class="wave-layer-3">
      <path d="M 0,30 C 70,30 130,42 200,42 C 270,42 350,22 420,22 C 490,22 580,40 650,40 C 720,40 830,30 900,30 C 970,30 1030,42 1100,42 C 1170,42 1250,22 1320,22 C 1390,22 1480,40 1550,40 C 1620,40 1730,30 1800,30 L 1800,80 L 0,80 Z" fill="url(#waveGrad3)"/>
      <!-- Glowing Crest Rim -->
      <path d="M 0,30 C 70,30 130,42 200,42 C 270,42 350,22 420,22 C 490,22 580,40 650,40 C 720,40 830,30 900,30 C 970,30 1030,42 1100,42 C 1170,42 1250,22 1320,22 C 1390,22 1480,40 1550,40 C 1620,40 1730,30 1800,30" fill="none" stroke="url(#crestGrad)" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- FLOATING GOLDEN POLLEN SPARKLES -->
    <circle cx="180" cy="22" r="2.0" fill="#fef08a" class="sparkle-1"/>
    <circle cx="410" cy="30" r="1.8" fill="#fde047" class="sparkle-2"/>
    <circle cx="620" cy="20" r="2.2" fill="#fef08a" class="sparkle-3"/>
    <circle cx="780" cy="26" r="1.7" fill="#fbbf24" class="sparkle-4"/>
  </g>
</svg>